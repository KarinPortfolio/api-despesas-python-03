<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .login-container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px;
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
      }

      input[type="text"],
      input[type="password"] {
        width: calc(100% - 22px);
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
      }

      button[type="submit"] {
        background-color: rgb(218, 156, 231);
        color: #fff;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        font-size: 18px;
        cursor: pointer;
        width: 100%;
      }

      button[type="submit"]:hover {
        background-color: rgb(201, 52, 231);
      }

      .error-message {
        color: red;
        margin-top: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuário:</label>
          <input type="text" id="usuario" name="usuario" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" required />
        </div>
        <button type="submit">Entrar</button>
        <div id="errorMessage" class="error-message"></div>
      </form>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Evita o envio padrão do formulário

          const usernameInput = document.getElementById("usuario");
          const passwordInput = document.getElementById("senha");
          const errorMessageDiv = document.getElementById("errorMessage");

          const username = usernameInput.value;
          const password = passwordInput.value;

          // Limpa mensagens de erro anteriores
          errorMessageDiv.textContent = "";

          fetch("http://127.0.0.1:5000/", {
            // URL do seu servidor Flask
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              usuario: username, // Corresponde ao 'nome' esperado no Flask
              senha: password,
            }),
          })
            .then((response) => {
              if (!response.ok) {
                return response.json().then((data) => {
                  throw new Error(data.msg || "Erro na autenticação");
                });
              }
              return response.json();
            })
            .then((data) => {
              // Agora este .then está corretamente encadeado
              if (data.access_token) {
                localStorage.setItem("authToken", data.access_token);
                window.location.href = "/protegido";
              } else {
                errorMessageDiv.textContent =
                  "Login bem-sucedido, mas token não recebido.";
              }
            })
            .catch((error) => {
              errorMessageDiv.textContent = error.message;
            });
        });
    </script>
  </body>
</html>
